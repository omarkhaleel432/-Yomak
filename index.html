/* ---------- helpers ---------- */
function el(id){return document.getElementById(id)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function isObj(x){return x&&typeof x==='object'&&!Array.isArray(x)}
function cleanStr(v,max){return typeof v==='string'?v.trim().slice(0,max):(typeof v==='number'&&isFinite(v)?String(v).slice(0,max):'')}
function todayKey(){let z=new Date(),y=z.getFullYear(),m=String(z.getMonth()+1).padStart(2,'0'),day=String(z.getDate()).padStart(2,'0');return `${y}-${m}-${day}`}
function isDateKey(s){return typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s)&&!isNaN(Date.parse(s))}
function svcIcon(c){return ({'مطاعم':'🍔','كافيهات':'☕','صيدليات':'💊','خدمات المنزل':'🔧','بقالة':'🛒','مواصلات':'🚗'})[c]||'🏪'}

function defaultData(){return {country:'',region:'',city:'',name:'',budget:0,budgets:{EGP:0,SAR:0},expenses:[],orders:[],favs:[],added:[],...extraDefaults()}}

/* ---------- data sanitising (used for localStorage and for restored backups) ---------- */
function sanitizeData(raw){
  if(!isObj(raw))return defaultData();
  const out=defaultData();
  out.country=['EG','SA'].includes(raw.country)?raw.country:'';
  out.region=cleanStr(raw.region,80);out.city=cleanStr(raw.city,80);out.name=cleanStr(raw.name,60);
  if(out.country==='SA'&&out.region==='الشرقية')out.region='المنطقة الشرقية';
  const num=v=>{v=Number(v);return Number.isFinite(v)&&v>=0&&v<=MAX_AMOUNT?v:0};
  const rb=isObj(raw.budgets)?raw.budgets:null;
  out.budgets={EGP:num(rb&&rb.EGP),SAR:num(rb&&rb.SAR)};
  if(!rb&&num(raw.budget)>0)out.budgets[out.country==='SA'?'SAR':'EGP']=num(raw.budget);
  out.budget=out.budgets[out.country==='SA'?'SAR':'EGP'];
  const used=new Set(),uid=v=>{let n=Number(v);if(!Number.isFinite(n)||n<=0||used.has(n)){n=Date.now();while(used.has(n))n++}used.add(n);return n};
  const defCur=out.country==='SA'?'SAR':'EGP';
  out.expenses=(Array.isArray(raw.expenses)?raw.expenses:[]).filter(isObj).map(e=>{
    const a=Number(e.amount);if(!Number.isFinite(a)||a<=0||a>MAX_AMOUNT)return null;
    const cat=CATS.includes(e.cat)?e.cat:'أخرى';
    return {id:uid(e.id),amount:a,title:cleanStr(e.title,60)||cat,cat,date:isDateKey(e.date)?e.date:todayKey(),currency:['EGP','SAR'].includes(e.currency)?e.currency:defCur};
  }).filter(Boolean);
  out.orders=(Array.isArray(raw.orders)?raw.orders:[]).filter(isObj);
  demo.forEach(s=>used.add(s.id));
  out.added=(Array.isArray(raw.added)?raw.added:[]).filter(isObj).map(s=>{
    const name=cleanStr(s.name,60);if(!name)return null;
    const cat=SVC_CATS.includes(s.cat)?s.cat:'أخرى';
    return {id:uid(s.id),name,cat,icon:svcIcon(cat),desc:cleanStr(s.desc,120)||'نشاط مضاف',phone:cleanStr(s.phone,20),open:s.open!==false};
  }).filter(Boolean);
  const ids=new Set([...demo,...out.added].map(s=>s.id));
  out.favs=(Array.isArray(raw.favs)?raw.favs:[]).filter(x=>typeof x==='number'&&ids.has(x)).filter((x,i,a)=>a.indexOf(x)===i);
  sanitizeExtra(raw,out);
  return out;
}
function loadData(){try{const raw=localStorage.getItem(STORAGE_KEY);if(!raw)return defaultData();return sanitizeData(JSON.parse(raw))}catch(err){return defaultData()}}

/* ===== extra data model (phase 1): dates, sanitisers ===== */
const AR_DAYS=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];

function an(n){return String(n).replace(/\d/g,c=>'٠١٢٣٤٥٦٧٨٩'[c])}
function pad2(n){return String(n).padStart(2,'0')}
function keyOf(z){return z.getFullYear()+'-'+pad2(z.getMonth()+1)+'-'+pad2(z.getDate())}
function keyToDate(k){const p=String(k).split('-').map(Number);return new Date(p[0],p[1]-1,p[2],12)}
function addDays(k,n){const z=keyToDate(k);z.setDate(z.getDate()+n);return keyOf(z)}
function daysBetween(a,b){return Math.round((keyToDate(b)-keyToDate(a))/864e5)}
function dim(y,m){return new Date(y,m,0).getDate()}
function fmtDate(k){const z=keyToDate(k);return AR_DAYS[z.getDay()]+'، '+an(z.getDate())+' '+AR_MONTHS[z.getMonth()]}
function fmtTime(t){if(!t)return '';const p=t.split(':').map(Number),h=p[0],m=p[1];return an((h%12)||12)+':'+an(pad2(m))+(h<12?' ص':' م')}
function uid2(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function extraDefaults(){return {tasks:[],habits:[],notes:[],events:[],market:[],jobs:[],apps:[],homefood:[],settings:{tourDone:false,notif:false,lat:0,lng:0,method:''},cache:{},fired:{}}}
/* generic cleaners */
function N_(v,def,max){v=Number(v);return Number.isFinite(v)&&Math.abs(v)<=(max||1e12)?v:def}
function K_(v){return isDateKey(v)?v:''}
function T_(v){return typeof v==='string'&&/^([01]\d|2[0-3]):[0-5]\d$/.test(v)?v:''}
function IMG_(v){return typeof v==='string'&&/^data:image\/(jpeg|png|webp);base64,/.test(v)&&v.length<700000?v:''}
function boolMap_(o){const r={};if(isObj(o))Object.keys(o).slice(0,6000).forEach(k=>{if(/^\d{4}-\d{2}-\d{2}$/.test(k)&&(o[k]===true||o[k]===1))r[k]=1});return r}
function list_(x,fn){const seen=new Set(),out=[];(Array.isArray(x)?x:[]).filter(isObj).slice(0,3000).forEach(o=>{let r;try{r=fn(o)}catch(e){r=null}if(!r)return;let id=(typeof o.id==='string'||typeof o.id==='number')&&/^[A-Za-z0-9_-]{1,39}$/.test(String(o.id))?String(o.id):'';if(!id||seen.has(id))id=uid2()+out.length;seen.add(id);r.id=id;out.push(r)});return out}
function sanitizeExtra(raw,out){
  const C=out.country,pick=(v,arr,def)=>arr.includes(v)?v:def,ctry=v=>['EG','SA'].includes(v)?v:C;
  out.tasks=list_(raw.tasks,t=>{const title=cleanStr(t.title,100);if(!title)return null;return {title,date:K_(t.date)||todayKey(),time:T_(t.time),notes:cleanStr(t.notes,300),repeat:pick(t.repeat,['none','daily','weekly','monthly'],'none'),remind:t.remind===true,done:boolMap_(t.done),created:N_(t.created,Date.now(),4e12)}});
  out.habits=list_(raw.habits,h=>{const name=cleanStr(h.name,40);if(!name)return null;return {name,icon:cleanStr(h.icon,4)||'⭐',checks:boolMap_(h.checks),created:N_(h.created,Date.now(),4e12)}});
  out.notes=list_(raw.notes,n=>{const text=cleanStr(n.text,3000);if(!text)return null;return {text,created:N_(n.created,Date.now(),4e12),updated:N_(n.updated,Date.now(),4e12)}});
  out.events=list_(raw.events,e=>{const title=cleanStr(e.title,100),date=K_(e.date);if(!title||!date)return null;return {title,date,time:T_(e.time),type:pick(e.type,EVENT_TYPES.map(x=>x[0]),'other'),repeat:e.repeat==='yearly'?'yearly':'none',remind:e.remind!==false}});
  out.market=list_(raw.market,m=>{const title=cleanStr(m.title,80);if(!title)return null;return {title,price:N_(m.price,0,1e9),desc:cleanStr(m.desc,400),phone:cleanStr(m.phone,20),cat:pick(m.cat,MARKET_CATS,'أخرى'),img:IMG_(m.img),country:ctry(m.country),ts:N_(m.ts,Date.now(),4e12)}});
  out.jobs=list_(raw.jobs,j=>{const title=cleanStr(j.title,80);if(!title)return null;return {title,kind:pick(j.kind,JOB_TYPES,'وظيفة'),company:cleanStr(j.company,60),desc:cleanStr(j.desc,400),phone:cleanStr(j.phone,20),country:ctry(j.country),ts:N_(j.ts,Date.now(),4e12)}});
  out.apps=list_(raw.apps,a=>{const jobId=cleanStr(a.jobId,40);if(!jobId)return null;return {jobId,jobTitle:cleanStr(a.jobTitle,80),name:cleanStr(a.name,60),phone:cleanStr(a.phone,20),msg:cleanStr(a.msg,300),ts:N_(a.ts,Date.now(),4e12)}});

  const s=isObj(raw.settings)?raw.settings:{};

let d=loadData(),step=1,current='home',svcFilter='',navPushed=false,ignorePops=0,locBackup=null,lastDay='';

/* apply a change; if saving fails, roll the in-memory data back so memory never differs from storage */
function tx(fn){const snap=JSON.stringify(d);try{fn()}catch(err){d=JSON.parse(snap);return false}if(!save()){d=JSON.parse(snap);msg(SAVE_ERR);return false}return true}
function newId(){let n=Date.now();const used=new Set([...demo,...d.expenses,...d.added].map(x=>x.id));while(used.has(n))n++;return n}

function loc(){return [d.city,d.region].filter(Boolean).join('، ')}
function norm(s){return String(s||'').toLocaleLowerCase('ar').normalize('NFC').replace(/[٠-٩]/g,c=>c.charCodeAt(0)-1632).replace(/[۰-۹]/g,c=>c.charCodeAt(0)-1776).replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/[ً-ٟـ]/g,'').replace(/\s+/g,' ').trim()}

function exportBackup(){
  try{
    const payload={app:'YOMAK',backupVersion:1,exportedAt:new Date().toISOString(),data:d};
    const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json;charset=utf-8'});
    const url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;a.download='yomak-backup-'+todayKey()+'.json';document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);msg('تم تجهيز النسخة الاحتياطية');
  }catch(err){msg('لم نتمكن من إنشاء النسخة. حاول مرة أخرى');}
}
function normalizeBackupData(raw){
  if(!isObj(raw))throw new Error('invalid');
  for(const key of ['expenses','orders','favs','added'])if(raw[key]!==undefined&&!Array.isArray(raw[key]))throw new Error('invalid-'+key);
  return sanitizeData(raw);
}
function afterRestore(){closeAllLayers();step=1;locBackup=null;if(d.name&&d.city)showApp();else showOn()}
function importBackup(file){
  if(!file)return;
  if(file.size>15*1024*1024){msg('حجم ملف النسخة أكبر من المسموح');return;}
  const reader=new FileReader();
  reader.onerror=()=>msg('تعذر قراءة الملف. تأكد أنه ملف نسخة يومك');
  reader.onload=()=>{
    let incoming;
    try{
      const parsed=JSON.parse(String(reader.result||'').replace(/^﻿/,''));
      if(!parsed||parsed.app!=='YOMAK'||parsed.backupVersion!==1||!parsed.data)throw new Error('format');
      incoming=normalizeBackupData(parsed.data);
    }catch(err){msg('الملف غير صالح أو ليس نسخة احتياطية من يومك');return;}
    if(!confirm('سيتم استبدال البيانات الحالية بالبيانات الموجودة في النسخة الاحتياطية. هل تريد المتابعة؟'))return;
    const previous=d;
    try{
      localStorage.setItem(UNDO_KEY,JSON.stringify(previous));
      d=incoming;
      if(!save()){d=previous;msg('لم نتمكن من حفظ الاسترجاع. بياناتك الحالية لم تتغير');return;}
      closeModal();afterRestore();msg('تم استرجاع النسخة الاحتياطية بنجاح');
    }catch(err){d=previous;try{save()}catch(e){}msg('تعذر استرجاع النسخة. بياناتك الحالية لم تتغير');}
  };
  try{reader.readAsText(file);}catch(err){msg('تعذر فتح الملف. حاول اختيار النسخة مرة أخرى');}
}
function undoRestore(){
  let raw=null;try{raw=localStorage.getItem(UNDO_KEY)}catch(e){}
  if(!raw)return msg('لا توجد نسخة سابقة للتراجع إليها');
  if(!confirm('سيتم استبدال البيانات الحالية بالبيانات التي كانت قبل آخر استرجاع. هل تريد المتابعة؟'))return;
  const previous=d;
  try{
    const inc=sanitizeData(JSON.parse(raw));
    localStorage.setItem(UNDO_KEY,JSON.stringify(previous));
    d=inc;
    if(!save()){d=previous;msg('لم نتمكن من حفظ التراجع. بياناتك الحالية لم تتغير');return;}
    afterRestore();msg('تم التراجع عن الاسترجاع');
  }catch(err){d=previous;msg('تعذر التراجع. بياناتك الحالية لم تتغير');}
}

const layers=[],pageStack=[],PAGES={};
function pushLayer(t,replace){layers.push(t);try{replace?history.replaceState({y:t},''):history.pushState({y:t},'')}catch(e){}}
function hideModalEl(){el('modal').classList.add('hide')}
function openModal(s){el('sheet').innerHTML=s;el('sheet').scrollTop=0;el('modal').classList.remove('hide');if(!layers.includes('m'))pushLayer('m')}
function closeModal(fromPop){hideModalEl();const i=layers.lastIndexOf('m');if(i>=0){layers.splice(i,1);if(!fromPop){ignorePops++;try{history.back()}catch(e){ignorePops--}}}}
function closeTopLayer(fromPop){const t=layers.pop();if(!t)return;if(t==='m')hideModalEl();else if(t==='p'){pageStack.pop();renderPage()}if(!fromPop){ignorePops++;try{history.back()}catch(e){ignorePops--}}}
function closeAllLayers(){const n=layers.length;layers.length=0;pageStack.length=0;hideModalEl();renderPage();if(n){ignorePops++;try{history.go(-n)}catch(e){ignorePops--}}}
function backBtn(){if(layers.length)closeTopLayer(false);else go('home')}
window.addEventListener('popstate',()=>{if(ignorePops>0){ignorePops--;return}if(layers.length){closeTopLayer(true);return}if(navPushed){navPushed=false;go('home',true)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&layers.length)closeTopLayer(false)});
function msg(s){document.querySelectorAll('.toast').forEach(t=>t.remove());let t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=s;document.body.append(t);setTimeout(()=>t.remove(),2100)}
function openPage(n,p){if(!PAGES[n])return;if(n==='calendar')cal.sel='';if(layers[layers.length-1]==='m'){hideModalEl();layers.pop();pageStack.push({n,p});pushLayer('p',true)}else{pageStack.push({n,p});pushLayer('p')}renderPage()}
function renderPage(){const pg=el('page');if(!pg)return;const t=pageStack[pageStack.length-1];if(!t){pg.classList.add('hide');pg.innerHTML='';document.body.classList.remove('nopage');return}
  const P=PAGES[t.n],old=pg.querySelector('.pbody'),sc=old?old.scrollTop:0,same=pg.dataset.n===t.n+'|'+pageStack.length;
  pg.dataset.n=t.n+'|'+pageStack.length;pg.classList.remove('hide');
  pg.innerHTML=`<div class="phead"><button class="pback" aria-label="رجوع" onclick="backBtn()">→</button><h2>${P.title(t.p)}</h2>${P.act?P.act(t.p):''}</div><div class="pbody">${P.render(t.p)}</div>`;
  if(same){const b=pg.querySelector('.pbody');if(b)b.scrollTop=sc}if(P.after)P.after(t.p)}
function curPage(){const t=pageStack[pageStack.length-1];return t?t.n:''}
function refresh(){render();renderPage()}
function go(t,fromPop){
  if(!fromPop){
    if(t!=='home'&&current==='home'&&!navPushed&&!layers.length){try{history.pushState({y:'t'},'')}catch(e){}navPushed=true}
    else if(t==='home'&&navPushed&&!layers.length){navPushed=false;ignorePops++;try{history.back()}catch(e){ignorePops--}}
  }
  current=t;
  if(t!=='services'){const s=el('search');if(s)s.value=''}
  document.querySelectorAll('.nav button').forEach(b=>{const on=b.dataset.t===({groups:'chat',day:'home',expenses:'profile',orders:'profile'}[t]||t);b.classList.toggle('active',on);b.setAttribute('aria-current',on?'page':'false')});
  render();
}

function readImage(file,max,q){return new Promise((res,rej)=>{if(!file||!/^image\//.test(file.type))return rej(new Error('type'));const fr=new FileReader();fr.onerror=()=>rej(new Error('read'));fr.onload=()=>{const im=new Image();im.onerror=()=>rej(new Error('img'));im.onload=()=>{const sc=Math.min(1,(max||720)/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*sc));c.height=Math.max(1,Math.round(im.height*sc));c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q||0.62))};im.src=fr.result};fr.readAsDataURL(file)})}

function greet(){const h=new Date().getHours();return h<5?'ليلة سعيدة':h<12?'صباح الخير':h<17?'نهارك سعيد':'مساء الخير'}
function occursOn(t,k){if(k<t.date)return false;if(t.repeat==='none')return k===t.date;if(t.repeat==='daily')return true;const a=keyToDate(t.date),b=keyToDate(k);if(t.repeat==='weekly')return a.getDay()===b.getDay();if(t.repeat==='monthly')return b.getDate()===Math.min(a.getDate(),dim(b.getFullYear(),b.getMonth()+1));return false}
function eventOn(e,k){if(e.repeat!=='yearly')return e.date===k;const a=keyToDate(e.date),b=keyToDate(k);if(a.getMonth()!==b.getMonth())return false;return b.getDate()===Math.min(a.getDate(),dim(b.getFullYear(),b.getMonth()+1))}
function nextEventDate(e,k){if(e.repeat!=='yearly')return e.date>=k?e.date:null;const a=keyToDate(e.date),y=keyToDate(k).getFullYear();for(let yy=y;yy<=y+1;yy++){const day=Math.min(a.getDate(),dim(yy,a.getMonth()+1)),c=yy+'-'+pad2(a.getMonth()+1)+'-'+pad2(day);if(c>=k)return c}return null}
function tasksOn(k){return d.tasks.filter(t=>occursOn(t,k)).sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99'))}
function eventsOn(k){return d.events.filter(e=>eventOn(e,k)).sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99'))}
function evIcon(t){return (EVENT_TYPES.find(x=>x[0]===t)||EVENT_TYPES[4])[1]}
function repLabel(r){return r==='daily'?'يوميًا':r==='weekly'?'أسبوعيًا':r==='monthly'?'شهريًا':''}
function dailyLeft(){const b=budgetVal();if(!b)return null;const z=new Date();return b/dim(z.getFullYear(),z.getMonth()+1)-todaySpend()}

const alertSources=[];
function computeAlerts(now){now=now||new Date();const tk=keyOf(now),mins=now.getHours()*60+now.getMinutes(),out=[];
  d.tasks.forEach(t=>{if(!t.remind||!t.time||!occursOn(t,tk)||t.done[tk])return;const p=t.time.split(':').map(Number),tm=p[0]*60+p[1];if(mins>=tm-60&&mins<=tm+120)out.push({key:'t:'+t.id+':'+tk,icon:'⏰',title:'تذكير بمهمة',text:t.title+' — '+(mins<tm?'بعد '+an(tm-mins)+' دقيقة':'الآن')})});
  d.events.forEach(e=>{if(!e.remind)return;const nx=nextEventDate(e,tk);if(!nx)return;const df=daysBetween(tk,nx);if(df===1)out.push({key:'e1:'+e.id+':'+nx,icon:evIcon(e.type),title:'تنبيه موعد',text:'غدًا: '+e.title});if(df===0)out.push({key:'e0:'+e.id+':'+nx,icon:evIcon(e.type),title:'موعد اليوم',text:'اليوم: '+e.title+(e.time?' — '+fmtTime(e.time):'')})});
  alertSources.forEach(f=>{try{f(now,tk,mins).forEach(a=>out.push(a))}catch(e){}});return out}

function grpCard(g,chat){const mem=!!cl.mine[g.id];return `<div class="card"><b>${esc(g.name)}</b> <span class="pill">${g.country==='SA'?'🇸🇦':g.country==='EG'?'🇪🇬':''} ${an(grpCount(g))} عضو</span>${g.description?`<p class="muted">${esc(g.description)}</p>`:''}<div class="chips">${mem?`<button class="chip on" onclick="openGroup('${esc(g.id)}','${chat?'chat':'posts'}')">${chat?'💬 افتح الشات':'فتح'}</button>`:`<button class="chip" onclick="joinGroup('${esc(g.id)}')">انضمام</button>`}</div></div>`}
function openGroup(id,tab){const g=(cl.groups||[]).find(x=>x.id===id);if(!g)return;cl.tab=tab||'posts';cl.posts=null;cl.msgs=null;cl.lastMsg=0;openPage('group',{id:g.id,name:g.name})}
async function joinGroup(id){if(banStop())return;try{await ensureProfile();await sb('/rest/v1/group_members',{method:'POST',body:{group_id:id}});cl.mine[id]=1;msg('تم الانضمام');cl.groups=null;cl.conv=false;refresh()}catch(e){msg(sbErr(e))}}
function groupModal(){formModal('إنشاء جروب',inp('gName','اسم الجروب','',{max:60})+inp('gDesc','وصف (اختياري)','',{area:1,max:300,rows:3})+'<p id="gErr" class="muted" style="color:#b0352d;overflow-wrap:anywhere"></p>',()=>{createGroup();return false},{save:'إنشاء'})}
async function ensureProfile(){const s=cs();if(!s)return;const r=await sb('/rest/v1/profiles?id=eq.'+s.uid+'&select=id');if(!r||!r.length)await sb('/rest/v1/profiles',{method:'POST',prefer:'resolution=merge-duplicates',body:{id:s.uid,name:(s.name||d.name||'مستخدم').slice(0,40),country:d.country}})}
function showErr(id,e){const t=sbErr(e),x=el(id);if(x)x.textContent='⚠️ '+t;msg(t.slice(0,80))}
async function createGroup(){if(banStop())return;const name=val('gName');if(name.length<2){msg('اكتب اسم الجروب (حرفين على الأقل)');return}
  try{await ensureProfile();const r=await sb('/rest/v1/groups',{method:'POST',prefer:'return=representation',body:{name,description:val('gDesc'),country:d.country}});const id=r&&r[0]&&r[0].id;if(!id)throw {message:'تعذر إنشاء الجروب'};
    await sb('/rest/v1/group_members',{method:'POST',body:{group_id:id}});cl.groups=null;cl.conv=false;closeModal();refresh();msg('تم إنشاء الجروب')}catch(e){showErr('gErr',e)}}
function whoBar(){const s=cs();return s?`<p class="muted">مسجّل باسم <b>${esc(s.name)}</b> · <a href="#" onclick="sbLogout();return false">خروج</a></p>`:''}
PAGES.groups={title:()=>'الجروبات',act:()=>cs()?`<button class="pact" aria-label="تحديث" onclick="cl.gTs=0;refresh()">↻</button><button class="pact" onclick="groupModal()">＋ جروب</button>`:'',
  render:()=>{if(!cs())return authCard();const g=cl.groups;return whoBar()+(cl.err?`<div class="card alertbox">${esc(cl.err)} <button class="chip" onclick="cl.groups=null;refresh()">إعادة المحاولة</button></div>`:'')+(g===null?'<p class="muted">جاري التحميل…</p>':g.length?g.map(x=>grpCard(x,false)).join(''):'<div class="card empty"><div style="font-size:34px">👥</div><b>لا توجد جروبات بعد</b><p class="muted">أنشئ أول جروب.</p></div>')},
  after:()=>{if(cs()&&(cl.groups===null||Date.now()-(cl.gTs||0)>20000))loadGroups()}};
PAGES.chat={title:()=>'الشات',render:()=>{if(!cs())return authCard();const g=cl.groups;if(g===null)return '<p class="muted">جاري التحميل…</p>';const m=g.filter(x=>cl.mine[x.id]);return whoBar()+(m.length?m.map(x=>grpCard(x,true)).join(''):'<div class="card empty"><div style="font-size:34px">💬</div><b>لا توجد محادثات</b><p class="muted">انضم لجروب من صفحة الجروبات ليظهر شاته هنا.</p><button class="chip on" onclick="openPage(\'groups\')">الجروبات</button></div>')},
  after:()=>{if(cs()&&cl.groups===null)loadGroups()}};
async function loadPosts(id){try{cl.posts=await sb('/rest/v1/posts?group_id=eq.'+encodeURIComponent(id)+'&select=id,body,created_at,user_id,profiles(name)&order=created_at.desc&limit=50')}catch(e){cl.posts=[];msg(sbErr(e))}if(curPage()==='group'&&cl.tab==='posts')refresh()}
function msgHtml(){const s=cs();return (cl.msgs||[]).map(m=>`<div class="bub${s&&m.user_id===s.uid?' me':''}"><small>${esc(m.profiles&&m.profiles.name||'')} · ${when(m.created_at)}${s&&m.user_id!==s.uid?` · <a href="#" onclick="reportItem('message','${m.id}');return false">إبلاغ</a>`:''}</small><div>${esc(m.body)}</div></div>`).join('')||'<p class="muted">ابدأ المحادثة…</p>'}
async function loadMsgs(id,quiet){try{const r=await sb('/rest/v1/messages?group_id=eq.'+encodeURIComponent(id)+'&select=id,body,created_at,user_id,profiles(name)&order=id.desc&limit=60');const l=(r||[]).reverse(),last=l.length?l[l.length-1].id:0;
  if(quiet&&last===cl.lastMsg&&cl.msgs)return;cl.msgs=l;cl.lastMsg=last;const b=el('msgs');if(b){b.innerHTML=msgHtml();b.scrollTop=b.scrollHeight}else if(curPage()==='group'&&cl.tab==='chat')refresh()}catch(e){if(!quiet){cl.msgs=cl.msgs||[];msg(sbErr(e))}}}
function curGroup(){const t=pageStack[pageStack.length-1];return t&&t.n==='group'?t.p:null}
function setTab(t){cl.tab=t;refresh()}
async function sendPost(){if(banStop())return;const g=curGroup(),b=val('pBody');if(!g)return;if(!b){msg('اكتب المنشور');return}
  try{await sb('/rest/v1/posts',{method:'POST',body:{group_id:g.id,body:b}});el('pBody').value='';await loadPosts(g.id);msg('تم النشر')}catch(e){msg(sbErr(e))}}
async function sendMsg(){if(banStop())return;const g=curGroup(),b=val('cBody');if(!g)return;if(!b)return;
  try{await sb('/rest/v1/messages',{method:'POST',body:{group_id:g.id,body:b}});el('cBody').value='';await loadMsgs(g.id)}catch(e){msg(sbErr(e))}}
async function delPost(id){if(!confirm('حذف المنشور؟'))return;try{await sb('/rest/v1/posts?id=eq.'+encodeURIComponent(id),{method:'DELETE'});const g=curGroup();if(g)loadPosts(g.id)}catch(e){msg(sbErr(e))}}
async function reportItem(kind,id){if(!confirm('إبلاغ عن هذا المحتوى؟'))return;try{await sb('/rest/v1/reports',{method:'POST',body:{kind,target:String(id),reason:'مخالف'}});msg('تم إرسال البلاغ')}catch(e){msg(sbErr(e))}}
PAGES.group={title:p=>esc(p&&p.name||'جروب'),render:p=>{const s=cs();if(!s)return authCard();
  const tabs=groupBar(curGroupObj())+`<div class="seg"><button class="${cl.tab==='posts'?'on':''}" onclick="setTab('posts')">📰 المنشورات</button><button class="${cl.tab==='chat'?'on':''}" onclick="setTab('chat')">💬 الشات</button></div>`;
  if(cl.tab==='chat')return tabs+`<div id="msgs" class="msgs">${cl.msgs===null?'<p class="muted">جاري التحميل…</p>':msgHtml()}</div><div class="row" style="display:flex;gap:6px;margin-top:8px"><input id="cBody" class="input" maxlength="1000" placeholder="اكتب رسالة" aria-label="رسالة" onkeydown="if(event.key==='Enter')sendMsg()"><button class="pact" onclick="sendMsg()">إرسال</button></div>`;
  return tabs+`<div class="card"><textarea id="pBody" class="input" rows="3" maxlength="1000" placeholder="اكتب منشورًا للجروب" aria-label="منشور"></textarea><button class="primary" style="margin-top:8px" onclick="sendPost()">نشر</button></div>`+(cl.posts===null?'<p class="muted">جاري التحميل…</p>':cl.posts.length?cl.posts.map(x=>`<div class="card"><small class="muted">${esc(x.profiles&&x.profiles.name||'')} · ${when(x.created_at)}</small><p style="white-space:pre-wrap">${esc(x.body)}</p>${x.user_id===s.uid||canMod(curGroupObj())?`<button class="chip" onclick="delPost('${esc(x.id)}')">🗑 حذف</button>`:''}${x.user_id!==s.uid?`<button class="chip" onclick="reportItem('post','${esc(x.id)}')">إبلاغ</button>`:`<button class="chip" onclick="editItem('post','${esc(x.id)}')">✏️ تعديل</button>`}<button class="chip" onclick="copyItem('post','${esc(x.id)}')">📋 نسخ</button>${cl.admin&&x.user_id!==s.uid?`<button class="chip" onclick="banModal('${esc(x.user_id)}')">🚫 حظر</button>`:''}</div>`).join(''):'<div class="card empty"><b>لا توجد منشورات</b></div>')},
  after:p=>{if(!cs()||!p)return;if(cl.tab==='chat'){if(cl.msgs===null)loadMsgs(p.id);else{const b=el('msgs');if(b)b.scrollTop=b.scrollHeight}}else if(cl.posts===null)loadPosts(p.id)}};
setInterval(()=>{const g=curGroup();if(g&&cl.tab==='chat'&&!document.hidden&&cs()&&navigator.onLine)loadMsgs(g.id,true)},2000);
/* ===== المكالمات الصوتية: مكان تركيب المزوّد (مثلًا WebRTC + TURN) ===== */
const CALL_PROVIDER={ready:false,name:'',start:null,answer:null,hangup:null,mute:null}; // ركّب الخدمة هنا لاحقًا
function startCall(){if(!CALL_PROVIDER.ready||!CALL_PROVIDER.start){msg('خدمة المكالمات لم تُركّب بعد');return}CALL_PROVIDER.start()}
function callAct(k){if(!CALL_PROVIDER.ready||!CALL_PROVIDER[k]){msg('خدمة المكالمات لم تُركّب بعد');return}CALL_PROVIDER[k]()}
PAGES.calls={title:()=>'مكالمات صوتية',render:()=>`<div class="card alertbox"><b>📞 جاهزة للتركيب</b><p class="muted">الواجهة موجودة، ومزوّد المكالمات (WebRTC + سيرفر TURN) لم يُركَّب بعد.</p></div><div class="chips"><button class="chip" onclick="startCall()">📞 اتصال</button><button class="chip" onclick="callAct('mute')">🎙️ كتم</button><button class="chip" onclick="callAct('hangup')">⛔ إنهاء</button></div><div class="card empty"><div style="font-size:34px">📞</div><b>لا توجد مكالمات</b></div>`};

/* ===== شات خاص بين شخصين ===== */
cl.ctab='groups';cl.dm=null;cl.dmMsgs=null;cl.dmLast=0;
async function loadDms(){try{cl.dm=await sb('/rest/v1/dm_chats?select=id,user_a,user_b,a:profiles!dm_chats_user_a_fkey(name),b:profiles!dm_chats_user_b_fkey(name)&order=created_at.desc&limit=100')}catch(e){cl.dm=[];cl.err=sbErr(e);msg(sbErr(e).slice(0,90))}if(curPage()==='chat')refresh()}
function dmName(x){const s=cs();const o=s&&x.user_a===s.uid?x.b:x.a;return (o&&o.name)||'مستخدم'}
function setCtab(t){cl.ctab=t;refresh()}
function dmModal(){formModal('محادثة خاصة جديدة',inp('dQ','ابحث باسم الشخص','',{max:40})+'<button class="secondary" type="button" style="margin-top:8px" onclick="findPeople()">بحث</button><div id="dRes"></div><p id="dErr" class="muted" style="color:#b0352d;overflow-wrap:anywhere"></p>',()=>{findPeople();return false},{save:'بحث'})}
async function findPeople(){const q=val('dQ').replace(/[%*,()]/g,' ').trim(),s=cs();if(q.length<2){msg('اكتب حرفين على الأقل');return}
  try{const r=await sb('/rest/v1/profiles?select=id,name,country&name=ilike.*'+encodeURIComponent(q)+'*&id=neq.'+s.uid+'&limit=20');const b=el('dRes');if(!b)return;
    b.innerHTML=r&&r.length?r.map(x=>`<button class="mcard" style="width:100%;margin-top:6px" data-id="${esc(x.id)}" data-nm="${esc(x.name)}" onclick="startDm(this.dataset.id,this.dataset.nm)"><b>${esc(x.name)}</b> <span class="muted">${x.country==='SA'?'🇸🇦':x.country==='EG'?'🇪🇬':''}</span></button>`).join(''):'<p class="muted">لا توجد نتائج</p>'}catch(e){showErr('dErr',e)}}
async function startDm(other,name){if(banStop())return;const s=cs();if(!s||!/^[0-9a-f-]{36}$/i.test(other))return;const [a,b]=s.uid<other?[s.uid,other]:[other,s.uid];
  try{await ensureProfile();let r=await sb('/rest/v1/dm_chats?select=id&user_a=eq.'+a+'&user_b=eq.'+b);let id=r&&r[0]&&r[0].id;
    if(!id){r=await sb('/rest/v1/dm_chats',{method:'POST',prefer:'return=representation',body:{user_a:a,user_b:b}});id=r&&r[0]&&r[0].id}
    if(!id)throw {message:'تعذر بدء المحادثة'};cl.dm=null;cl.dmMsgs=null;cl.dmLast=0;openPage('dm',{id,name})}catch(e){showErr('dErr',e)}}
PAGES.chat={title:()=>'الشات',act:()=>cs()&&cl.ctab==='dm'?`<button class="pact" onclick="dmModal()">＋ خاص</button>`:'',render:()=>{if(!cs())return authCard();
  const tabs=`<div class="seg"><button class="${cl.ctab==='groups'?'on':''}" onclick="setCtab('groups')">👥 شات الجروبات</button><button class="${cl.ctab==='dm'?'on':''}" onclick="setCtab('dm')">👤 شات خاص</button></div>`;
  if(cl.ctab==='dm'){const l=cl.dm;return tabs+whoBar()+`<button class="primary" onclick="dmModal()">＋ محادثة خاصة جديدة</button>`+(l===null?'<p class="muted">جاري التحميل…</p>':l.length?l.map(x=>`<div class="card"><b>${esc(dmName(x))}</b><div class="chips"><button class="chip on" data-id="${esc(x.id)}" data-nm="${esc(dmName(x))}" onclick="openDm(this.dataset.id,this.dataset.nm)">💬 افتح</button></div></div>`).join(''):'<div class="card empty"><div style="font-size:34px">👤</div><b>لا توجد محادثات خاصة</b><p class="muted">ابحث عن شخص بالاسم وابدأ محادثة.</p></div>')}
  const g=cl.groups;if(g===null)return tabs+'<p class="muted">جاري التحميل…</p>';const m=g.filter(x=>cl.mine[x.id]);return tabs+whoBar()+(cl.err?`<div class="card alertbox" style="overflow-wrap:anywhere">${esc(cl.err)}</div>`:'')+(m.length?m.map(x=>grpCard(x,true)).join(''):'<div class="card empty"><div style="font-size:34px">💬</div><b>لا توجد جروبات</b><p class="muted">أنشئ جروبًا أو انضم لجروب من صفحة الجروبات ليظهر شاته هنا.</p><button class="chip on" onclick="openPage(\'groups\')">الجروبات</button></div>')},
  after:()=>{if(!cs())return;if(cl.ctab==='dm'){if(cl.dm===null)loadDms()}else if(cl.groups===null||Date.now()-(cl.gTs||0)>20000)loadGroups()}};
function openDm(id,name){cl.dmMsgs=null;cl.dmLast=0;openPage('dm',{id,name})}
function dmHtml(){const s=cs();return (cl.dmMsgs||[]).map(m=>`<div class="bub${s&&m.user_id===s.uid?' me':''}"><small>${when(m.created_at)}${s&&m.user_id!==s.uid?` · <a href="#" onclick="reportItem('message','dm:${m.id}');return false">إبلاغ</a>`:''}</small><div>${esc(m.body)}</div></div>`).join('')||'<p class="muted">ابدأ المحادثة…</p>'}
async function loadDmMsgs(id,quiet){try{const r=await sb('/rest/v1/dm_messages?chat_id=eq.'+encodeURIComponent(id)+'&select=id,body,created_at,user_id&order=id.desc&limit=60');const l=(r||[]).reverse(),last=l.length?l[l.length-1].id:0;if(quiet&&last===cl.dmLast&&cl.dmMsgs)return;cl.dmMsgs=l;cl.dmLast=last;const b=el('dmsgs');if(b){b.innerHTML=dmHtml();b.scrollTop=b.scrollHeight}else if(curPage()==='dm')refresh()}catch(e){if(!quiet){cl.dmMsgs=cl.dmMsgs||[];msg(sbErr(e).slice(0,90))}}}
function curDm(){const t=pageStack[pageStack.length-1];return t&&t.n==='dm'?t.p:null}
async function sendDm(){if(banStop())return;const g=curDm(),b=val('dBody');if(!g||!b)return;try{await sb('/rest/v1/dm_messages',{method:'POST',body:{chat_id:g.id,body:b}});el('dBody').value='';await loadDmMsgs(g.id)}catch(e){msg(sbErr(e).slice(0,90))}}
PAGES.dm={title:p=>esc(p&&p.name||'محادثة'),render:p=>{if(!cs())return authCard();return `<div id="dmsgs" class="msgs">${cl.dmMsgs===null?'<p class="muted">جاري التحميل…</p>':dmHtml()}</div><div class="row" style="display:flex;gap:6px;margin-top:8px"><input id="dBody" class="input" maxlength="1000" placeholder="اكتب رسالة" aria-label="رسالة" onkeydown="if(event.key==='Enter')sendDm()"><button class="pact" onclick="sendDm()">إرسال</button></div>`},after:p=>{if(!cs()||!p)return;if(cl.dmMsgs===null)loadDmMsgs(p.id);else{const b=el('dmsgs');if(b)b.scrollTop=b.scrollHeight}}};
setInterval(()=>{const g=curDm();if(g&&!document.hidden&&cs()&&navigator.onLine)loadDmMsgs(g.id,true)},2000);

/* ===== الإشراف: حذف + إبلاغ + حظر + لوحة الإدارة ===== */
cl.admin=null;cl.ban=null;cl.rep=0;cl.meTs=0;cl.meErr='';cl.atab='reports';cl.rlist=null;cl.blist=null;cl.names={};
const UUID_RE=/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i,NUM_RE=/^\d{1,18}$/;
function banActive(){return !!(cl.ban&&(!cl.ban.until||new Date(cl.ban.until).getTime()>Date.now()))}
function banMsg(){const b=cl.ban;return 'أنت محظور من المشاركة '+(b&&b.until?'حتى '+when(b.until):'بشكل دائم')+(b&&b.reason?' — '+b.reason:'')}
function banStop(){if(banActive()){msg(banMsg());return true}cl.ban=null;return false}
async function loadMe(){const s=cs();if(!s)return;
  try{const [a,b]=await Promise.all([sb('/rest/v1/admins?select=user_id&user_id=eq.'+s.uid),sb('/rest/v1/bans?select=id,until,reason&user_id=eq.'+s.uid+'&order=id.desc&limit=10')]);
    cl.meErr='';cl.admin=!!(a&&a.length);const now=Date.now();cl.ban=(b||[]).find(x=>!x.until||new Date(x.until).getTime()>now)||null}catch(e){cl.meErr=sbErr(e)}
  if(cl.admin)pollReports();commRefresh()}
function curGroupObj(){const g=curGroup();return g?((cl.groups||[]).find(x=>x.id===g.id)||null):null}
function canMod(g){const s=cs();return !!(cl.admin||(g&&s&&g.owner===s.uid))}
function whoBar(){const s=cs();if(!s)return '';return `<p class="muted">مسجّل باسم <b>${esc(s.name)}</b> · <a href="#" onclick="sbLogout();return false">خروج</a></p><p class="muted" style="font-size:11px;overflow-wrap:anywhere">نسخة الإشراف ٢١-١١ · ${cl.admin?'حسابك: مدير ✅':cl.meErr?'تعذر التحقق من الصلاحيات: '+esc(cl.meErr):cl.meTs?'حسابك: مستخدم عادي':'جاري التحقق…'}</p>`+(banActive()?`<div class="card alertbox"><b>⛔ ${esc(banMsg())}</b></div>`:'')+(cl.admin?`<button class="primary" style="margin-bottom:8px" onclick="openPage('admin')">🛡️ لوحة الإدارة${cl.rep?' ('+an(cl.rep)+' بلاغ جديد)':''}</button>`:'')}
async function delRow(path){const r=await sb(path,{method:'DELETE',prefer:'return=representation'});return !!(r&&r.length)}
function msgHtml(){const s=cs(),mod=canMod(curGroupObj());return (cl.msgs||[]).map(m=>{const me=s&&m.user_id===s.uid;return `<div class="bub${me?' me':''}"><small>${esc(m.profiles&&m.profiles.name||'')} · ${when(m.created_at)}${!me?` · <a href="#" onclick="reportItem('message','${m.id}');return false">إبلاغ</a>`:''}${me||mod?` · <a href="#" onclick="delMsg('${m.id}');return false">🗑 حذف</a>`:''}</small><div>${esc(m.body)}</div></div>`}).join('')||'<p class="muted">ابدأ المحادثة…</p>'}
function dmHtml(){const s=cs();return (cl.dmMsgs||[]).map(m=>{const me=s&&m.user_id===s.uid;return `<div class="bub${me?' me':''}"><small>${when(m.created_at)}${!me?` · <a href="#" onclick="reportItem('dm','${m.id}');return false">إبلاغ</a>`:` · <a href="#" onclick="delDmMsg('${m.id}');return false">🗑 حذف</a>`}</small><div>${esc(m.body)}</div></div>`}).join('')||'<p class="muted">ابدأ المحادثة…</p>'}
async function delMsg(id){if(!NUM_RE.test(String(id))||!confirm('حذف الرسالة؟'))return;const g=curGroup();try{const ok=await delRow('/rest/v1/messages?id=eq.'+id);if(!ok)msg('لم يتم الحذف (لا تملك الصلاحية)');if(g)await loadMsgs(g.id)}catch(e){msg(sbErr(e).slice(0,90))}}
async function delDmMsg(id){if(!NUM_RE.test(String(id))||!confirm('حذف الرسالة؟'))return;const g=curDm();try{const ok=await delRow('/rest/v1/dm_messages?id=eq.'+id);if(!ok)msg('لم يتم الحذف');if(g)await loadDmMsgs(g.id)}catch(e){msg(sbErr(e).slice(0,90))}}
async function delPost(id){if(!UUID_RE.test(String(id))||!confirm('حذف المنشور؟'))return;try{const ok=await delRow('/rest/v1/posts?id=eq.'+id);if(!ok)msg('لم يتم الحذف (لا تملك الصلاحية)');const g=curGroup();if(g)loadPosts(g.id)}catch(e){msg(sbErr(e).slice(0,90))}}
function groupBar(g){const s=cs();if(!g||!s)return '';const own=g.owner===s.uid,a=[];
  if(own||cl.admin)a.push(`<button class="chip" onclick="delGroup()">🗑 حذف الجروب</button>`);

async function delGroup(){const g=curGroup();if(!g||!UUID_RE.test(g.id)||!confirm('حذف الجروب بكل منشوراته ورسائله نهائيًا؟'))return;try{const ok=await delRow('/rest/v1/groups?id=eq.'+g.id);if(!ok){msg('لم يتم الحذف (لا تملك الصلاحية)');return}cl.groups=null;cl.conv=false;backBtn();msg('تم حذف الجروب')}catch(e){msg(sbErr(e).slice(0,90))}}
async function leaveGroup(){const g=curGroup(),s=cs();if(!g||!s||!confirm('الخروج من الجروب؟'))return;try{await delRow('/rest/v1/group_members?group_id=eq.'+g.id+'&user_id=eq.'+s.uid);cl.groups=null;cl.conv=false;backBtn();msg('تم الخروج من الجروب')}catch(e){msg(sbErr(e).slice(0,90))}}

{const _dm=PAGES.dm.render;PAGES.dm.render=p=>cs()?`<div class="chips"><button class="chip" onclick="delDm()">🗑 حذف المحادثة</button></div>`+_dm(p):_dm(p)}

const REASONS=['إساءة أو سب','تحرش أو إزعاج','رسائل مزعجة (سبام)','محتوى غير لائق','أخرى'];
function findItem(kind,id){const sid=String(id),g=curGroup(),dm=curDm();
  if(kind==='post'){const x=(cl.posts||[]).find(p=>String(p.id)===sid);return x&&{author:x.user_id,snap:x.body,ref:g&&g.id}}
  if(kind==='message'){const x=(cl.msgs||[]).find(p=>String(p.id)===sid);return x&&{author:x.user_id,snap:x.body,ref:g&&g.id}}
  if(kind==='dm'){const x=(cl.dmMsgs||[]).find(p=>String(p.id)===sid);return x&&{author:x.user_id,snap:x.body,ref:dm&&dm.id}}
  if(kind==='group'){const x=(cl.groups||[]).find(p=>p.id===sid);return x&&{author:x.owner,snap:x.name+(x.description?' — '+x.description:''),ref:x.id}}
  if(kind==='office'){const x=(es.offices||[]).find(p=>p.id===sid);return x&&{author:x.owner,snap:x.name+' — '+x.city+(x.about?' — '+x.about:''),ref:x.id}}
  if(kind==='property'){const x=allProps().find(p=>p.id===sid);return x&&{author:x.owner,snap:propText(x),ref:x.office_id}}
  if(kind==='review'){const x=es.cur&&es.cur.revs.find(p=>p.id===sid);return x&&{author:x.user_id,snap:'تقييم '+x.rating+'/5 — '+(x.comment||''),ref:x.office_id}}
  if(kind==='service'){const x=allFeedPosts().find(p=>p.id===sid);return x&&{author:x.user_id,snap:[x.title,x.body,x.phone?'☎'+x.phone:''].filter(Boolean).join(' — ')+(Array.isArray(x.images)&&x.images.length?' [صور: '+x.images.length+']':''),ref:x.id}}
  if(kind==='comment'){const x=Object.values(fd.cm).flat().find(p=>p.id===sid);return x&&{author:x.user_id,snap:x.body,ref:x.post_id}}
  return null}
function reportItem(kind,id){const o=findItem(kind,id);if(!o){msg('تعذر العثور على المحتوى');return}
  formModal('إبلاغ للإدارة',selF('rReason','سبب البلاغ',REASONS,REASONS[0])+inp('rNote','تفاصيل (اختياري)','',{area:1,max:300,rows:2})+'<p id="rErr" class="muted" style="color:#b0352d;overflow-wrap:anywhere"></p>',()=>{sendReport(kind,id,o);return false},{save:'إرسال البلاغ'})}
async function sendReport(kind,id,o){try{await ensureProfile();await sb('/rest/v1/reports',{method:'POST',body:{kind,target:String(id),reason:(val('rReason')+(val('rNote')?' — '+val('rNote'):'')).slice(0,400),author:UUID_RE.test(String(o.author))?o.author:null,snapshot:String(o.snap||'').slice(0,500),ref_id:o.ref?String(o.ref):null}});closeModal();msg('تم إرسال البلاغ للإدارة')}catch(e){showErr('rErr',e)}}

const KIND_AR={post:'منشور',message:'رسالة جروب',dm:'رسالة خاصة',group:'جروب',service:'إعلان خدمة',office:'مكتب عقاري',property:'عقار',review:'تقييم',comment:'تعليق'};
async function pollReports(){if(!cl.admin||!cs())return;try{const r=await sb('/rest/v1/reports?select=id&status=eq.open&limit=100');const n=(r||[]).length;if(n>cl.rep&&cl.repInit)msg('🛡️ بلاغ جديد ('+an(n)+')');cl.repInit=true;if(n!==cl.rep){cl.rep=n;commRefresh()}}catch(e){}}

async function loadNames(ids){ids=[...new Set(ids.filter(x=>x&&UUID_RE.test(String(x))))].filter(x=>!cl.names[x]);if(!ids.length)return;const r=await sb('/rest/v1/profiles?select=id,name&id=in.('+ids.join(',')+')');(r||[]).forEach(p=>cl.names[p.id]=p.name)}

  if(L==='bans'){const l=cl.blist;return l===null?'<p class="muted">جاري التحميل…</p>':l.length?l.map(x=>{const act=!x.until||new Date(x.until).getTime()>Date.now();return `<div class="card"><b>${esc(nmOf(x.user_id))}</b> <span class="pill">${act?(x.until?'حتى '+when(x.until):'دائم'):'منتهي'}</span><p class="muted">${esc(x.reason)}</p><div class="chips"><button class="chip" onclick="unban(${Number(x.id)})">رفع الحظر</button></div></div>`}).join(''):'<div class="card empty"><b>لا يوجد محظورون</b></div>'}

PAGES.admin={title:()=>'🛡️ لوحة الإدارة',render:()=>{if(!cs()||!cl.admin)return '<div class="card empty"><b>غير مصرّح</b><p class="muted">هذه الصفحة للإدارة فقط.</p></div>';const T=[['reports','البلاغات'+(cl.rep?' ('+an(cl.rep)+')':'')],['bans','المحظورون'],['groups','الجروبات']];return `<div class="seg">${T.map(t=>`<button class="${cl.atab===t[0]?'on':''}" onclick="setAtab('${t[0]}')">${t[1]}</button>`).join('')}</div>`+adminBody()},

  const T={post:['posts',UUID_RE],message:['messages',NUM_RE],dm:['dm_messages',NUM_RE],group:['groups',UUID_RE],service:['service_posts',UUID_RE],office:['offices',UUID_RE],property:['properties',UUID_RE],review:['office_reviews',UUID_RE],comment:['post_comments',UUID_RE]}[r.kind];
  if(!T||!T[1].test(String(r.target))){msg('هدف البلاغ غير صالح');return}

async function unban(id){if(!confirm('رفع الحظر؟'))return;try{await delRow('/rest/v1/bans?id=eq.'+Number(id));cl.blist=null;refresh();msg('تم رفع الحظر')}catch(e){msg(sbErr(e).slice(0,90))}}

cl.pp={};cl.me=null;cl.cq='';cl.cf='all';cl.conv=false;cl.cTs=0;cl.gq='';cl.gf='all';cl.lastG={};cl.lastD={};
const AV_RE=/^data:image\/jpeg;base64,[A-Za-z0-9+\/=]+$/;
function avCol(id){let h=0;for(const c of String(id||''))h=(h*31+c.charCodeAt(0))%360;return 'hsl('+h+' 45% 40%)'}
function avHtml(p,sz){sz=sz||44;const n=(p&&p.name)||'?',st='width:'+sz+'px;height:'+sz+'px;font-size:'+Math.round(sz*.45)+'px';
  if(p&&p.avatar&&AV_RE.test(p.avatar))return '<img class="av" style="'+st+'" alt="" src="'+p.avatar+'">';
  return '<span class="av" style="'+st+';background:'+avCol((p&&p.id)||n)+'">'+esc([...String(n)][0]||'?')+'</span>'}
function whenShort(t){const x=new Date(t);if(isNaN(x))return '';const n=new Date();return x.toDateString()===n.toDateString()?x.toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'}):x.toLocaleDateString('ar-EG',{day:'numeric',month:'short'})}
async function loadPeople(ids){ids=[...new Set((ids||[]).filter(x=>UUID_RE.test(String(x))&&!cl.pp[x]))];if(!ids.length)return;
  const q=ids.join(',');let r;
  try{r=await sb('/rest/v1/profiles?select=id,name,username,avatar,city,country,verified,bio&id=in.('+q+')')}catch(e){try{r=await sb('/rest/v1/profiles?select=id,name&id=in.('+q+')')}catch(e2){return}}
  (r||[]).forEach(p=>cl.pp[p.id]=p)}
async function loadNames(ids){await loadPeople(ids)}
function nmOf(id){return (cl.pp[id]&&cl.pp[id].name)||cl.names[id]||'مستخدم'}
function vfMark(p){return p&&p.verified?' <span class="vf" title="موثّق">✔</span>':''}
async function loadMe(){const s=cs();if(!s)return;
  try{const [a,b]=await Promise.all([sb('/rest/v1/admins?select=user_id&user_id=eq.'+s.uid),sb('/rest/v1/bans?select=id,until,reason&user_id=eq.'+s.uid+'&order=id.desc&limit=10')]);
    cl.meErr='';cl.admin=!!(a&&a.length);const now=Date.now();cl.ban=(b||[]).find(x=>!x.until||new Date(x.until).getTime()>now)||null}catch(e){cl.meErr=sbErr(e)}

function whoBar(){const s=cs();if(!s)return '';const m=cl.me||{name:s.name};

async function loadConv(){const s=cs();if(!s)return;cl.cTs=Date.now();cl.err='';if(!cl.meTs||Date.now()-cl.meTs>60000){cl.meTs=Date.now();loadMe()}
  try{const [g,m,dm,lg,ld]=await Promise.all([
    sb('/rest/v1/groups?select=id,name,description,country,owner&order=created_at.desc&limit=100'),
    sb('/rest/v1/group_members?select=group_id,user_id&limit=10000'),
    sb('/rest/v1/dm_chats?select=id,user_a,user_b&order=created_at.desc&limit=100'),
    sb('/rest/v1/messages?select=group_id,body,created_at,user_id&order=id.desc&limit=300'),
    sb('/rest/v1/dm_messages?select=chat_id,body,created_at,user_id&order=id.desc&limit=300')]);
    cl.gTs=Date.now();cl.groups=g||[];cl.mine={};cl.cnt={};(m||[]).forEach(x=>{cl.cnt[x.group_id]=(cl.cnt[x.group_id]||0)+1;if(x.user_id===s.uid)cl.mine[x.group_id]=1});
    cl.dm=dm||[];cl.lastG={};(lg||[]).forEach(x=>{if(!cl.lastG[x.group_id])cl.lastG[x.group_id]=x});cl.lastD={};(ld||[]).forEach(x=>{if(!cl.lastD[x.chat_id])cl.lastD[x.chat_id]=x});
    await loadPeople(cl.dm.map(x=>x.user_a===s.uid?x.user_b:x.user_a).concat(Object.values(cl.lastG).map(x=>x.user_id)));cl.conv=true}
  catch(e){cl.err=sbErr(e);cl.conv=true;if(!cl.groups)cl.groups=[];if(!cl.dm)cl.dm=[]}
  commRefresh()}
function dmOther(x){const s=cs();return s&&x.user_a===s.uid?x.user_b:x.user_a}

function oauthStart(provider){if(provider!=='google'&&provider!=='facebook')return;if(!/^https?:$/.test(location.protocol)){msg('الدخول بـ '+provider+' يعمل من رابط الموقع (https) فقط');return}
  location.href=SB_URL+'/auth/v1/authorize?provider='+provider+'&redirect_to='+encodeURIComponent(location.origin+location.pathname)}
async function oauthReturn(){const h=location.hash||'';if(!/(access_token=|error_description=)/.test(h))return;const P=new URLSearchParams(h.replace(/^#/,''));
  try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}
  if(P.get('error_description')){msg('تعذر الدخول: '+String(P.get('error_description')).slice(0,80));return}
  const at=P.get('access_token'),rt=P.get('refresh_token');if(!at||!rt)return;
  try{const u=await sbRaw('/auth/v1/user',{token:at});if(!u||!UUID_RE.test(String(u.id)))throw {message:'استجابة غير صالحة'};const meta=u.user_metadata||{};
    let nm=String(meta.full_name||meta.name||String(u.email||'').split('@')[0]||d.name||'مستخدم').slice(0,40);
    const s=saveSess({access_token:at,refresh_token:rt,expires_in:Number(P.get('expires_in'))||3600,user:u},nm);
    try{const r=await sb('/rest/v1/profiles?id=eq.'+s.uid+'&select=name');if(r&&r[0]&&r[0].name)nm=r[0].name}catch(e){}
    s.name=nm;setCs(s);await sb('/rest/v1/profiles',{method:'POST',prefer:'resolution=merge-duplicates',body:{id:s.uid,name:nm,country:d.country}});
    cl.groups=null;cl.conv=false;cl.meTs=0;cl.me=null;cl.pp={};const app=el('app');if(app&&!app.classList.contains('hide'))go('chat');msg('أهلًا '+nm)}catch(e){msg(sbErr(e).slice(0,90))}}

  String(t).split(/\n/).map(l=>l.replace(/^[\s•\-\*·▪✅🔹]+/,'').trim()).filter(Boolean).forEach(l=>{const m=l.match(/^([^:：]{1,22})[:：]\s*(.+)$/);if(!m)return;const k=m[1],v=m[2].trim();

function wrapL(x,t,mw){const ws=String(t).split(/\s+/),L=[];let c='';ws.forEach(w=>{const n=c?c+' '+w:w;if(x.measureText(n).width>mw&&c){L.push(c);c=w}else c=n});if(c)L.push(c);return L}

  if(pairs.length){pairs.slice(0,4).forEach((p,i)=>{const col=i%2,row=Math.floor(i/2),bx=col?60:W/2+10,by=y+row*98;rr(x,bx,by,W/2-70,84,20,'#fff');x.strokeStyle='#e5ece8';x.lineWidth=2;x.stroke();ctext(x,'📐 '+p,bx+(W/2-70)/2,by+42,36,D,W/2-100,1)});y+=Math.ceil(Math.min(4,pairs.length)/2)*98+14}

  <div class="card"><b>🎬 نص فيديو تيك توك</b><textarea id="agTk" class="input" rows="10" aria-label="نص الفيديو"></textarea><div class="fact"><button class="fchip" onclick="copyText(el('agTk').value)">📋 نسخ</button></div></div>`);
  el('agWa').value=t.wa;el('agTk').value=t.tk;o.scrollIntoView&&o.scrollIntoView({behavior:'smooth',block:'start'})}
function agBlob(){return new Promise(r=>ag.canvas.toBlob(r,'image/png'))}
async function agSave(){if(!ag.canvas)return;const b=await agBlob();if(!b){msg('تعذر الحفظ');return}const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='yomak-ad.png';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);msg('تم حفظ الصورة')}
async function agShare(){if(!ag.canvas)return;const b=await agBlob(),txt=el('agWa')?el('agWa').value:'';try{const file=new File([b],'yomak-ad.png',{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],text:txt});return}if(navigator.share){await navigator.share({text:txt});return}}catch(e){if(e&&e.name==='AbortError')return}copyText(txt);agSave()}
function agWaOpen(){const t=el('agWa')?el('agWa').value:'';window.open('https://wa.me/?text='+encodeURIComponent(t),'_blank','noopener')}
async function agPublish(){if(!cs()){authModal('signup');return}if(banStop()||!ag.canvas)return;const f=ag.f,ph=normPhone(f.phone,'SA');if(!ph){msg('رقم التواصل غير صحيح');return}
  const parts=String(f.place||'').split(/\s+[-–—]\s+|،/).map(s=>s.trim()).filter(Boolean),head=parts[0]||f.place||'';
  const sm=document.createElement('canvas');sm.width=540;sm.height=675;sm.getContext('2d').drawImage(ag.canvas,0,0,540,675);let im=sm.toDataURL('image/jpeg',0.7);if(im.length>600000)im=sm.toDataURL('image/jpeg',0.5);im=await upImg(im)||null;
  try{await ensureProfile();await sb('/rest/v1/service_posts',{method:'POST',prefer:'return=representation',body:{country:'SA',city:(es.office&&es.office.city)||d.city||'',category:'estate',title:((f.type||'عقار')+' '+(f.deal==='rent'?'للإيجار':'للبيع')+' في '+head).slice(0,80),body:(el('agWa')?el('agWa').value:'').slice(0,1000),phone:ph,whatsapp:true,price:(f.price||'').slice(0,40),images:im?[im]:[],region:(d.region||'').slice(0,60)}});fd.list=null;fd.ts=0;msg('تم النشر في YOMAK ✅');closeAllLayers();setTimeout(()=>go('home'),300)}catch(e){msg(sbErr(e).slice(0,90))}}

/* ===== بوابة الدخول الإجباري بالإيميل (بعد اختيار البلد والمنطقة والمدينة) ===== */
function gateDev(){try{return localStorage.getItem('yomak_nogate')==='1'}catch(e){return false}}
function gateDone(){const g=el('gate');if(g)g.remove()}
function gateCheck(){if(cs()||gateDev()){gateDone();return}gateShow()}
function gateShow(){if(el('gate'))return;const g=document.createElement('div');g.id='gate';g.className='gate';g.setAttribute('role','dialog');g.setAttribute('aria-modal','true');g.setAttribute('aria-label','تسجيل الدخول');document.body.appendChild(g);gateMode('signup')}
function gateMode(m){const g=el('gate');if(!g)return;const su=m==='signup';
  g.innerHTML=`<div class="gbox"><div class="onbrand">يومك <small>YOMAK</small></div><h1>${su?'أنشئ حسابك':'أهلًا بعودتك'}</h1><p class="muted">📍 ${esc(loc())} — حسابك صفحتك الشخصية، وبنفسه الشات والجروبات والمنشورات.</p>${oauthBtns()}${su?inp('aName','الاسم الظاهر',d.name||'',{max:40}):''}${inp('aMail','البريد الإلكتروني','',{type:'email',mode:'email',max:120})}${inp('aPass','كلمة السر (٦ أحرف على الأقل)','',{type:'password',max:72})}<button class="primary" style="margin-top:10px" onclick="doAuth(${su})">${su?'إنشاء الحساب':'دخول'}</button><button class="secondary" type="button" style="margin-top:8px" onclick="gateMode('${su?'login':'signup'}')">${su?'عندي حساب — دخول':'ما عنديش حساب — إنشاء حساب'}</button><p class="muted" style="font-size:12px;margin-top:10px">لازم حساب بإيميلك لاستخدام التطبيق: بنستخدمه عشان تنشر وتتواصل وتحفظ حسابك على أي جهاز.</p></div>`;
  const p=el('aPass');if(p)p.onkeydown=e=>{if(e.key==='Enter')doAuth(su)}}

/* ---------- live data: weather (Open-Meteo), FX (ExchangeRate-API), gold (xaus) — fetched in the browser, no keys ---------- */
const LV_LS='yomak_live',LV_TTL={weather:30*60e3,rates:6*3600e3,gold:15*60e3};
let LV=(()=>{try{const o=JSON.parse(localStorage.getItem(LV_LS));return o&&typeof o==='object'?o:{}}catch(e){return {}}})();
let lvBusy=false,lvFail={};
function lvSave(){try{localStorage.setItem(LV_LS,JSON.stringify({weather:LV.weather,rates:LV.rates,gold:LV.gold}))}catch(e){}}
async function lvJson(u){const c=new AbortController(),t=setTimeout(()=>c.abort(),9000);try{const r=await fetch(u,{signal:c.signal,cache:'no-store'});if(!r.ok)throw new Error('http '+r.status);return await r.json()}finally{clearTimeout(t)}}
const lvNum=(x,a,b)=>{x=Number(x);return Number.isFinite(x)&&x>=a&&x<=b?x:null};
const LV_PLACES=()=>{const c=coords(),mine={name:c.src||'موقعك',lat:c.lat,lng:c.lng},cai={name:'القاهرة',lat:30.04,lng:31.24},ry={name:'الرياض',lat:24.71,lng:46.68};const o=d.country==='SA'?[ry,cai]:[cai,ry];const seen=Math.abs(mine.lat-o[0].lat)<.3&&Math.abs(mine.lng-o[0].lng)<.3||Math.abs(mine.lat-o[1].lat)<.3&&Math.abs(mine.lng-o[1].lng)<.3;return seen?o:[mine,...o]};
async function lvWeather(){const P=LV_PLACES();
  const j=await lvJson('https://api.open-meteo.com/v1/forecast?latitude='+P.map(p=>p.lat).join(',')+'&longitude='+P.map(p=>p.lng).join(',')+'&current=temperature_2m,weather_code,wind_speed_10m,relative_humidity_2m&daily=temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=1');
  const arr=Array.isArray(j)?j:[j],items=[];
  arr.forEach((x,i)=>{const c=x&&x.current,dl=x&&x.daily;if(!c||!dl||!P[i])return;const t=lvNum(c.temperature_2m,-40,65);if(t===null)return;items.push({name:P[i].name,temp:t,min:lvNum(dl.temperature_2m_min&&dl.temperature_2m_min[0],-40,65),max:lvNum(dl.temperature_2m_max&&dl.temperature_2m_max[0],-40,65),code:Number(c.weather_code)||0,hum:lvNum(c.relative_humidity_2m,0,100),wind:lvNum(c.wind_speed_10m,0,300)})});
  if(!items.length)throw new Error('weather');LV.weather={ts:Date.now(),items}}
async function lvRates(){let e,s,src;
  try{const j=await lvJson('https://open.er-api.com/v6/latest/USD');if(j.result!=='success')throw 0;e=lvNum(j.rates&&j.rates.EGP,5,500);s=lvNum(j.rates&&j.rates.SAR,3.4,4.1);src='ExchangeRate-API';var upd=(Number(j.time_last_update_unix)||0)*1e3}
  catch(x){const j=await lvJson('https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.json');e=lvNum(j.usd&&j.usd.egp,5,500);s=lvNum(j.usd&&j.usd.sar,3.4,4.1);src='currency-api';var upd=Date.parse(j.date)||0}
  if(e===null||s===null)throw new Error('rates');LV.rates={ts:Date.now(),usdEgp:e,usdSar:s,src,upd}}
async function lvGold(){let oz,src,upd=0;
  try{const j=await lvJson('https://xaus.com/api/v1/spot?compact=1');oz=lvNum(j.spot_usd_oz,300,30000);src='xaus.com';upd=Date.parse(j.updated_at)||0}
  catch(x){const j=await lvJson('https://api.gold-api.com/price/XAU');oz=lvNum(j.price,300,30000);src='gold-api.com';upd=Date.parse(j.updatedAt)||0}
  if(oz===null)throw new Error('gold');LV.gold={ts:Date.now(),oz,src,upd}}
async function lvEnsure(force){if(lvBusy)return;const now=Date.now(),jobs=[['weather',lvWeather],['rates',lvRates],['gold',lvGold]].filter(x=>force||!LV[x[0]]||now-LV[x[0]].ts>LV_TTL[x[0]]);if(!jobs.length)return;
  lvBusy=true;lvRedraw();
  await Promise.all(jobs.map(async j=>{try{await j[1]();lvFail[j[0]]=false}catch(e){lvFail[j[0]]=true}}));
  lvBusy=false;lvSave();lvRedraw()}
function lvRedraw(){const t=pageStack&&pageStack[pageStack.length-1];if(t&&t.n==='live')renderPage();const s=el('livestrip');if(s)s.outerHTML=liveStrip()}
const lvAgo=ts=>{if(!ts)return '';const m=Math.round((Date.now()-ts)/6e4);return m<1?'الآن':m<60?'من '+an(m)+' دقيقة':m<1440?'من '+an(Math.round(m/60))+' ساعة':'من '+an(Math.round(m/1440))+' يوم'};
const lvPerG=(oz,rate)=>oz/31.1035*rate;
function lvGoldRows(cc){const g=LV.gold,r=LV.rates;if(!g||!r)return '<p class="muted">غير متاح الآن — اضغط تحديث.</p>';
  const cur=cc==='SA'?'SAR':'EGP',rate=cc==='SA'?r.usdSar:r.usdEgp,p=lvPerG(g.oz,rate),k=n=>cash(Math.round(p*n/24*100)/100,cur);
  const rows=cc==='SA'?[['عيار 24',24],['عيار 22',22],['عيار 21',21],['عيار 18',18]]:[['عيار 24',24],['عيار 21',21],['عيار 18',18]];
  return rows.map(x=>`<div class="pr"><span>${x[0]} (جرام)</span><b>${k(x[1])}</b></div>`).join('')+(cc==='EG'?`<div class="pr"><span>جنيه ذهب (٨ جم عيار 21)</span><b>${cash(Math.round(p*21/24*8),cur)}</b></div>`:'')+`<div class="pr"><span>الأونصة عالميًا</span><b>${Number(g.oz).toLocaleString('ar-EG',{maximumFractionDigits:2})} $</b></div>`}
function lvWeatherRows(){const w=LV.weather;if(!w)return '<p class="muted">غير متاح الآن — اضغط تحديث.</p>';return w.items.map(x=>`<div class="pr"><span>${esc(x.name)}</span><b>${an(Math.round(x.temp))}° ${WCODE(x.code)}</b></div><small class="muted">العظمى ${x.max===null?'—':an(Math.round(x.max))}° · الصغرى ${x.min===null?'—':an(Math.round(x.min))}°${x.hum===null?'':' · رطوبة '+an(Math.round(x.hum))+'٪'}${x.wind===null?'':' · رياح '+an(Math.round(x.wind))+' كم/س'}</small>`).join('')}
function liveStrip(){const w=LV.weather&&LV.weather.items[0],g=LV.gold,r=LV.rates,cc=d.country==='SA'?'SA':'EG';let t='';
  if(w)t+=`${an(Math.round(w.temp))}° ${esc(w.name)}`;
  if(g&&r){const rate=cc==='SA'?r.usdSar:r.usdEgp;t+=(t?' · ':'')+'🥇 21: '+cash(Math.round(lvPerG(g.oz,rate)*21/24),cc==='SA'?'SAR':'EGP')}
  if(r)t+=(t?' · ':'')+'💱 $١ = '+cash(Math.round(r.usdEgp*100)/100,'EGP');
  return `<div id="livestrip" class="daystrip" role="button" tabindex="0" onclick="openPage('live')"><div><b>🌤️ الطقس والأسعار</b><small>${t||(lvBusy?'جارِ التحميل…':'اضغط للتحديث')}</small></div><span>›</span></div>`}
PAGES.live={title:()=>'الطقس والأسعار 🌤️',render:()=>{setTimeout(()=>lvEnsure(false),0);const sa=d.country==='SA',r=LV.rates,bad=Object.keys(lvFail).filter(k=>lvFail[k]);
  const sec=cc=>`<div class="card"><b>🥇 الذهب في ${cc==='SA'?'السعودية':'مصر'}</b>${lvGoldRows(cc)}</div>`;
  const when=[['weather','الطقس'],['gold','الذهب'],['rates','العملات']].map(x=>LV[x[0]]?x[1]+' '+lvAgo(LV[x[0]].ts):'').filter(Boolean).join(' · ');
  return `<div class="row between"><small class="muted">${lvBusy?'جارِ التحديث…':(when||'لم يتم التحميل بعد')}</small><button class="secondary" onclick="lvEnsure(true)" ${lvBusy?'disabled':''}>🔄 تحديث</button></div>`
  +(bad.length?`<div class="card"><small>⚠️ تعذّر تحديث: ${bad.map(k=>({weather:'الطقس',rates:'العملات',gold:'الذهب'}[k])).join('، ')}. ${LV[bad[0]]?'المعروض آخر قيمة ناجحة (الوقت مكتوب فوق).':'لا توجد قيمة محفوظة.'} تأكد من الإنترنت وجرّب مرة تانية.</small></div>`:'')
  +`<div class="card"><b>🌤️ الطقس الآن</b>${lvWeatherRows()}<small class="muted">المصدر: Open-Meteo</small></div>`
  +`<div class="card"><b>💱 العملات</b>${r?`<div class="pr"><span>١ دولار</span><b>${cash(Math.round(r.usdEgp*100)/100,'EGP')}</b></div><div class="pr"><span>١ دولار</span><b>${cash(Math.round(r.usdSar*1000)/1000,'SAR')}</b></div><div class="pr"><span>١ ريال سعودي</span><b>${cash(Math.round(r.usdEgp/r.usdSar*100)/100,'EGP')}</b></div><small class="muted">المصدر: ${esc(r.src)}${r.upd?' · آخر تحديث للمصدر '+an(fmtDate(keyOf(new Date(r.upd)))):''}</small>`:'<p class="muted">غير متاح الآن — اضغط تحديث.</p>'}</div>`
  +(sa?sec('SA')+sec('EG'):sec('EG')+sec('SA'))
  +`<p class="muted">ℹ️ الذهب محسوب من السعر العالمي للأونصة × سعر الدولار الرسمي، فهو سعر استرشادي. سعر المحل الفعلي يزيد بالمصنعية والضريبة وفرق السوق، خصوصًا في مصر، فاسأل الصاغة قبل الشراء. الأرقام تتحدّث تلقائيًا كل ما تفتح الصفحة (الطقس ٣٠ دقيقة، الذهب ١٥ دقيقة، العملات ٦ ساعات) وليست نصيحة مالية.</p>`}};

/* ---------- PWA ---------- */
let deferredInstall=null;
function pwaInit(){
  try{if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e});
  window.addEventListener('appinstalled',()=>{deferredInstall=null});
}
function installApp(){if(deferredInstall){deferredInstall.prompt();deferredInstall=null}else msg('التثبيت: من قائمة المتصفح اختر "إضافة إلى الشاشة الرئيسية"')}

function home(){return dayHome()+homeBase()}
function services(){return servicesBase()}
