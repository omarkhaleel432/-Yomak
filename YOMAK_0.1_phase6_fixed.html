/* ---------- data sanitising (used for localStorage and for restored backups) ---------- */
function sanitizeData(raw){
  if(!isObj(raw))return defaultData();
  const out=defaultData();
  out.country=['EG','SA'].includes(raw.country)?raw.country:'';
  out.region=cleanStr(raw.region,80);out.city=cleanStr(raw.city,80);out.name=cleanStr(raw.name,60);

  const num=v=>{v=Number(v);return Number.isFinite(v)&&v>=0&&v<=MAX_AMOUNT?v:0};
  const rb=isObj(raw.budgets)?raw.budgets:null;
  out.budgets={EGP:num(rb&&rb.EGP),SAR:num(rb&&rb.SAR)};
  if(!rb&&num(raw.budget)>0)out.budgets[out.country==='SA'?'SAR':'EGP']=num(raw.budget);
  out.budget=out.budgets[out.country==='SA'?'SAR':'EGP'];
  const used=new Set(),uid=v=>{let n=Number(v);if(!Number.isFinite(n)||n<=0||used.has(n)){n=Date.now();while(used.has(n))n++}used.add(n);return n};
  const defCur=out.country==='SA'?'SAR':'EGP';
  out.expenses=(Array.isArray(raw.expenses)?raw.expenses:[]).filter(isObj).map(e=>{
    const a=Number(e.amount);if(!Number.isFinite(a)||a<=0||a>MAX_AMOUNT)return null;
    const cat=CATS.includes(e.cat)?e.cat:'أخرى';
    return {id:uid(e.id),amount:a,title:cleanStr(e.title,60)||cat,cat,date:isDateKey(e.date)?e.date:todayKey(),currency:['EGP','SAR'].includes(e.currency)?e.currency:defCur};
  }).filter(Boolean);
  out.orders=(Array.isArray(raw.orders)?raw.orders:[]).filter(isObj);
  demo.forEach(s=>used.add(s.id));
  out.added=(Array.isArray(raw.added)?raw.added:[]).filter(isObj).map(s=>{
    const name=cleanStr(s.name,60);if(!name)return null;
    const cat=SVC_CATS.includes(s.cat)?s.cat:'أخرى';
    return {id:uid(s.id),name,cat,icon:svcIcon(cat),desc:cleanStr(s.desc,120)||'نشاط مضاف',phone:cleanStr(s.phone,20),open:s.open!==false};
  }).filter(Boolean);
  const ids=new Set([...demo,...out.added].map(s=>s.id));
  out.favs=(Array.isArray(raw.favs)?raw.favs:[]).filter(x=>typeof x==='number'&&ids.has(x)).filter((x,i,a)=>a.indexOf(x)===i);
  return out;
}
function loadData(){try{const raw=localStorage.getItem(STORAGE_KEY);if(!raw)return defaultData();return sanitizeData(JSON.parse(raw))}catch(err){return defaultData()}}
let d=loadData(),step=1,current='home',svcFilter='',modalOpen=false,navPushed=false,ignorePops=0,locBackup=null,lastDay='';
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(d));return true}catch(err){console.warn('YOMAK save failed',err);return false}}
/* apply a change; if saving fails, roll the in-memory data back so memory never differs from storage */
function tx(fn){const snap=JSON.stringify(d);try{fn()}catch(err){d=JSON.parse(snap);return false}if(!save()){d=JSON.parse(snap);msg(SAVE_ERR);return false}return true}
function newId(){let n=Date.now();const used=new Set([...demo,...d.expenses,...d.added].map(x=>x.id));while(used.has(n))n++;return n}
function cur(){return d.country==='SA'?'SAR':'EGP'}
function budgetVal(){return Number(d.budgets&&d.budgets[cur()]||0)}
function cash(n,currency){const c=currency||cur();return Number(n||0).toLocaleString('ar-EG',{maximumFractionDigits:2})+(c==='SAR'?' ر.س':' ج.م')}
function loc(){return [d.city,d.region].filter(Boolean).join('، ')}
function norm(s){return String(s||'').toLocaleLowerCase('ar').normalize('NFC').replace(/[٠-٩]/g,c=>c.charCodeAt(0)-1632).replace(/[۰-۹]/g,c=>c.charCodeAt(0)-1776).replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/[ً-ٟـ]/g,'').replace(/\s+/g,' ').trim()}
function cities(q){let base=GEO[d.country]?.[d.region]||[];return base.filter(x=>norm(x).includes(norm(q)))}

/* ---------- modal / history (Android back button support) ---------- */
function openModal(s){el('sheet').innerHTML=s;el('sheet').scrollTop=0;el('modal').classList.remove('hide');if(!modalOpen){modalOpen=true;try{history.pushState({y:'m'},'')}catch(e){}}}
function closeModal(fromPop){el('modal').classList.add('hide');if(modalOpen){modalOpen=false;if(!fromPop){ignorePops++;try{history.back()}catch(e){ignorePops--}}}}
window.addEventListener('popstate',()=>{if(ignorePops>0){ignorePops--;return}if(modalOpen){closeModal(true);return}if(navPushed){navPushed=false;go('home',true)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modalOpen)closeModal()});
function msg(s){document.querySelectorAll('.toast').forEach(t=>t.remove());let t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=s;document.body.append(t);setTimeout(()=>t.remove(),2100)}

/* ---------- onboarding ---------- */
function init(){refreshDate();d.name&&d.city?showApp():showOn()}
function refreshDate(){lastDay=todayKey();el('date').textContent=new Date().toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'long'})}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&lastDay&&lastDay!==todayKey()){refreshDate();if(!el('app').classList.contains('hide'))render()}});
function showOn(){el('app').classList.add('hide');el('onboard').classList.remove('hide');drawStep()}
function drawStep(){let titles=['اختار دولتك','اختار المحافظة أو المنطقة','اختار المدينة أو المركز','عرفنا اسمك'],descs=['هنظبط الخدمات على مكانك.','حدد منطقتك.','اختار مدينة تابعة للمنطقة المحددة.','اكتب اسمك لبدء يومك.'];el('stepLabel').textContent=`الخطوة ${step} من 4`;el('onTitle').textContent=titles[step-1];el('onDesc').textContent=descs[step-1];el('onContent').innerHTML='';
  if(step===1)el('onContent').innerHTML=`<div class="choices"><button class="${d.country==='EG'?'selected':''}" onclick="pickCountry('EG')">🇪🇬<br>مصر</button><button class="${d.country==='SA'?'selected':''}" onclick="pickCountry('SA')">🇸🇦<br>السعودية</button></div>`;
  if(step===2)el('onContent').innerHTML=`<input class="input" placeholder="ابحث عن المحافظة أو المنطقة" aria-label="ابحث عن المحافظة أو المنطقة" oninput="options(this.value,2)"><div class="results" id="opts">${(d.country==='EG'?EG:SA).map(x=>option(x,2)).join('')}</div>`;
  if(step===3)el('onContent').innerHTML=`<div class="city-head"><span>📍 <b>${esc(d.region)}</b><br><small>المدن التابعة للمنطقة فقط</small></span><button class="city-clear" onclick="step=2;drawStep()">تغيير المنطقة</button></div><div class="city-search"><input id="citySearch" class="input" style="margin:0" placeholder="ابحث عن مدينة أو مركز" aria-label="ابحث عن مدينة أو مركز" oninput="options(this.value,3)"></div><div class="results" id="opts">${cities('').map(x=>option(x,3)).join('')}</div>`;
  if(step===4)el('onContent').innerHTML=`<input id="nameIn" class="input" maxlength="40" placeholder="اسمك" aria-label="اسمك" value="${esc(d.name)}">`;
  el('next').textContent=step===4?'ابدأ يومك':'التالي';el('back').classList.toggle('hide',step===1);el('cancelLoc').classList.toggle('hide',!locBackup)}
function option(x,s){return `<button class="result" onclick="${s===2?`pickRegion('${esc(x)}')`:`pickCity('${esc(x)}')`}">${esc(x)}</button>`}
function pickCountry(x){d.country=x;d.region='';d.city='';step=2;drawStep()}
function options(q,s){const list=el('opts');if(!list)return;const query=norm(q);let source=s===2?(d.country==='EG'?EG:SA):cities('');const a=source.filter(x=>norm(x).includes(query));list.innerHTML=a.map(x=>option(x,s)).join('')||'<div class="empty">لا توجد نتائج مطابقة</div>'}
function pickRegion(x){d.region=x;d.city='';step=3;drawStep()}
function pickCity(x){d.city=x;step=4;drawStep()}
function nextStep(){if(step===1&&!d.country)return msg('اختار الدولة');if(step===2&&!d.region)return msg('اختار المنطقة');if(step===3&&!d.city)return msg('اختار المدينة');if(step===4){let n=el('nameIn').value.trim();if(!n)return msg('اكتب اسمك');d.name=n.slice(0,40);locBackup=null;if(!save())msg(SAVE_ERR);showApp();return}step++;drawStep()}
function backStep(){if(step>1){step--;drawStep()}}
/* changing location is only committed when the flow is finished; "cancel" restores the saved one */
function changeLoc(){locBackup={country:d.country,region:d.region,city:d.city};step=1;showOn()}
function cancelLoc(){if(locBackup){d.country=locBackup.country;d.region=locBackup.region;d.city=locBackup.city;locBackup=null}showApp()}

/* ---------- shell ---------- */
function showApp(){el('onboard').classList.add('hide');el('app').classList.remove('hide');el('loc').textContent=loc();el('hello').textContent='أهلاً يا '+d.name+' 👋';go(current,true)}
function go(t,fromPop){
  if(!fromPop){
    if(t!=='home'&&current==='home'&&!navPushed){try{history.pushState({y:'t'},'')}catch(e){}navPushed=true}
    else if(t==='home'&&navPushed&&!modalOpen){navPushed=false;ignorePops++;try{history.back()}catch(e){ignorePops--}}
  }
  current=t;
  if(t!=='services'){const s=el('search');if(s)s.value=''}
  document.querySelectorAll('.nav button').forEach(b=>{const on=b.dataset.t===t;b.classList.toggle('active',on);b.setAttribute('aria-current',on?'page':'false')});
  render();
}
function render(){el('main').innerHTML=current==='home'?home():current==='services'?services():current==='expenses'?expenses():current==='orders'?orders():profile()}
function todaySpend(){return d.expenses.filter(x=>x.date===todayKey()&&x.currency===cur()).reduce((s,x)=>s+Number(x.amount),0)}
function monthSpend(){let m=todayKey().slice(0,7);return d.expenses.filter(x=>typeof x.date==='string'&&x.date.startsWith(m)&&x.currency===cur()).reduce((s,x)=>s+Number(x.amount),0)}
function budgetNote(b,sp){return b?(sp>b?`<span class="muted warn">⚠ تجاوزت الميزانية بمقدار ${cash(sp-b)}</span>`:`<span class="muted">المتبقي ${cash(b-sp)}</span>`):'<span class="muted">حدد ميزانيتك لمتابعة مصروفك</span>'}

/* ---------- home ---------- */

  return `<div class="card budget"><div class="row between"><div><div class="muted">مصروف النهارده</div><div class="big">${cash(todaySpend())}</div></div><div><div class="muted">ميزانية الشهر</div><b>${b?cash(b):'غير محددة'}</b></div></div><div class="progress"><span class="${b&&sp>b?'over':''}" style="width:${pct}%"></span></div><div class="row between">${budgetNote(b,sp)}<button class="secondary" onclick="budgetModal()">${b?'تعديل':'حدد الميزانية'}</button></div></div><div class="section"><h3>اختصاراتك</h3></div><div class="quick"><button onclick="go('services')"><span>🍔</span>أكل</button><button onclick="go('services')"><span>🛠️</span>خدمات</button><button onclick="expenseModal()"><span>💸</span>مصروف</button><button onclick="go('orders')"><span>📦</span>طلباتي</button></div><div class="section"><h3>خدمات قريبة منك</h3><button onclick="go('services')">الكل</button></div><div class="tiles">${demo.slice(0,4).map(serviceCard).join('')}</div>${favs.length?`<div class="section"><h3>مفضلتي</h3></div><div class="tiles">${favs.map(serviceCard).join('')}</div>`:''}<div class="section"><h3>آخر مصروفات</h3><button onclick="go('expenses')">الكل</button></div>${d.expenses.length?`<div class="list">${d.expenses.slice(-3).reverse().map(expItem).join('')}</div>`:'<div class="card empty">سجّل أول مصروف عشان تتابع يومك ✨</div>'}<div class="section"><h3>عندك نشاط؟</h3></div><div class="card row between"><div><b>ضيف نشاطك لأهل منطقتك</b><div class="muted">إضافة للمراجعة المحلية</div></div><button class="secondary" onclick="addServiceModal()">＋ أضف</button></div>`}

/* ---------- services ---------- */
function serviceCard(s){const f=d.favs.includes(s.id);return `<button class="service" onclick="details(${Number(s.id)})"><span class="icon">${s.icon||'🏪'}</span><span style="flex:1"><b>${esc(s.name)}${f?' <span class="fav" aria-label="مفضلة">♥</span>':''}</b><small>${esc(s.cat)} · ${esc(s.desc)}</small></span><span class="pill ${s.open?'':'closed'}">${s.open?'مفتوح':'مغلق'}</span></button>`}

function visibleServices(){const inp=el('search'),q=norm(inp?inp.value:'');let a=allServices();if(svcFilter)a=a.filter(s=>s.cat===svcFilter);if(q)a=a.filter(s=>norm([s.name,s.cat,s.desc,s.phone].filter(Boolean).join(' ')).includes(q));return a}
function serviceListHtml(){const a=visibleServices(),inp=el('search');return a.map(serviceCard).join('')||(inp&&inp.value.trim()?'<div class="empty">لا توجد نتائج مطابقة. جرّب كلمة أخرى.</div>':'<div class="empty">لا توجد بيانات في القسم بعد</div>')}
function services(){const cats=['مطاعم','كافيهات','صيدليات','خدمات المنزل'];return `<div class="title">الخدمات</div><p class="desc">في ${esc(d.city)} · البطاقات الحالية أمثلة وليست أنشطة حقيقية</p><div class="quick" style="margin-bottom:12px">${cats.map((c,i)=>`<button class="${svcFilter===c?'on':''}" aria-pressed="${svcFilter===c}" onclick="filter('${c}')"><span>${['🍔','☕','💊','🔧'][i]}</span>${c}</button>`).join('')}</div>${svcFilter?`<button class="secondary" style="margin-bottom:12px" onclick="filter('${svcFilter}')">عرض كل الخدمات ✕</button>`:''}<div id="serviceList" class="list">${serviceListHtml()}</div><button class="primary" style="margin-top:12px" onclick="addServiceModal()">＋ أضف نشاطك</button>`}
function filter(c){svcFilter=svcFilter===c?'':c;const s=el('search');if(s)s.value='';if(current==='services')render();else go('services')}
function search(q){svcFilter='';if(current!=='services')go('services');else render()}
function details(id){let s=allServices().find(x=>x.id===id);if(!s)return;let fv=d.favs.includes(id),mine=d.added.some(x=>x.id===id);
  openModal(`<button class="close" aria-label="إغلاق" onclick="closeModal()">×</button><div class="row"><span class="icon">${s.icon||'🏪'}</span><div><h3>${esc(s.name)}</h3><span class="pill ${s.open?'':'closed'}">${s.open?'مفتوح':'مغلق'}</span></div></div><p class="muted">${esc(d.city)} · ${mine?'نشاط مضاف على جهازك':'بيانات تجريبية'}</p>${mine?`<p class="muted">${esc(s.desc)}${s.phone?' · '+esc(s.phone):''}</p>`:''}<button class="primary" onclick="msg('الطلبات الحقيقية ستتوفر بعد ربط الأنشطة');closeModal()">اطلب الآن</button><button class="secondary" style="margin-top:8px" onclick="fav(${id})">${fv?'إزالة المفضلة':'♡ أضف للمفضلة'}</button>${mine?`<div class="row" style="margin-top:8px"><button class="secondary" onclick="addServiceModal(${id})">✎ تعديل</button><button class="secondary" style="color:#b0352d" onclick="deleteService(${id})">🗑 حذف</button></div>`:''}`)}
function fav(id){if(!tx(()=>{d.favs=d.favs.includes(id)?d.favs.filter(x=>x!==id):[...d.favs,id]}))return;closeModal();render();msg('تم تحديث المفضلة')}

  openModal(`<button class="close" aria-label="إغلاق" onclick="closeModal()">×</button><h3>${s?'تعديل النشاط':'أضف نشاطك'}</h3><p class="muted">هذه الإضافة محلية للتجربة ولن تظهر لمستخدمين آخرين.</p><input id="sName" class="input" maxlength="60" placeholder="اسم النشاط" aria-label="اسم النشاط" value="${esc(s&&s.name)}"><select id="sCat" class="input" aria-label="الفئة">${SVC_CATS.map(c=>`<option${s&&s.cat===c?' selected':''}>${c}</option>`).join('')}</select><input id="sPhone" class="input" maxlength="20" inputmode="tel" placeholder="رقم الهاتف (اختياري)" aria-label="رقم الهاتف (اختياري)" value="${esc(s&&s.phone)}"><input id="sDesc" class="input" maxlength="120" placeholder="وصف النشاط" aria-label="وصف النشاط" value="${esc(s&&s.desc!=='نشاط مضاف'?s.desc:'')}"><button class="primary" onclick="saveService(${s?s.id:''})">${s?'حفظ التعديل':'إضافة'}</button>`)}
function saveService(id){let n=el('sName').value.trim().slice(0,60);if(!n)return msg('اكتب اسم النشاط');let c=el('sCat').value,desc=el('sDesc').value.trim().slice(0,120)||'نشاط مضاف',phone=el('sPhone').value.trim().slice(0,20);

/* ---------- expenses ---------- */
function expenses(){const b=budgetVal(),sp=monthSpend();return `<div class="title">مصروفاتي 💰</div><p class="desc">تابع صرفك وميزانيتك. اضغط على أي مصروف لتعديله أو حذفه.</p><div class="card"><div class="row between"><div><small class="muted">إجمالي الشهر</small><div class="big">${cash(sp)}</div></div><div><small class="muted">مصروف اليوم</small><div class="big">${cash(todaySpend())}</div></div></div>${b?`<div class="progress" style="background:#e7efeb"><span style="width:${Math.min(100,sp/b*100)}%;background:${sp>b?'#d9534f':'var(--g)'}"></span></div>${budgetNote(b,sp)}`:''}<button class="primary" style="margin-top:12px" onclick="expenseModal()">＋ سجّل مصروف</button></div><div class="section"><h3>كل المصروفات</h3><button onclick="exportCSV()">تصدير CSV</button></div><div class="list">${d.expenses.slice().reverse().map(expItem).join('')||'<div class="empty">لا توجد مصروفات مسجلة</div>'}</div>`}
function expItem(e){const id=Number(e.id);return `<div class="expense" role="button" tabindex="0" onclick="expenseModal(${id})" onkeydown="if(event.key==='Enter')expenseModal(${id})"><div class="row"><span class="eicon">${icon(e.cat)}</span><div><b>${esc(e.title)}</b><small>${esc(e.cat)} · ${esc(e.date)}</small></div></div><b>${cash(e.amount,e.currency)}</b></div>`}
function expenseModal(id){const e=id?d.expenses.find(x=>x.id===id):null;
  openModal(`<button class="close" aria-label="إغلاق" onclick="closeModal()">×</button><h3>${e?'تعديل المصروف':'سجل مصروف'}</h3><input id="exTitle" class="input" maxlength="60" placeholder="مثلاً قهوة" aria-label="وصف المصروف" value="${esc(e&&e.title)}"><input id="exAmount" class="input" type="number" inputmode="decimal" min="0" max="${MAX_AMOUNT}" step="any" placeholder="المبلغ" aria-label="المبلغ" value="${e?esc(e.amount):''}"><select id="exCat" class="input" aria-label="الفئة">${CATS.map(c=>`<option${e&&e.cat===c?' selected':''}>${c}</option>`).join('')}</select><button class="primary" onclick="saveExpense(${e?e.id:''})">${e?'حفظ التعديل':'حفظ'}</button>${e?`<button class="secondary" style="margin-top:8px;color:#b0352d" onclick="deleteExpense(${e.id})">🗑 حذف المصروف</button>`:''}`)}
function saveExpense(id){let a=Number(el('exAmount').value),c=el('exCat').value,t=el('exTitle').value.trim().slice(0,60);
  if(!Number.isFinite(a)||a<=0)return msg('أدخل مبلغ أكبر من صفر');

function saveBudget(){const v=Number(el('budgetIn').value||0);if(!Number.isFinite(v)||v<0||v>MAX_AMOUNT)return msg('أدخل ميزانية صحيحة');if(!tx(()=>{d.budgets[cur()]=v;d.budget=v}))return;closeModal();render();msg('تم حفظ الميزانية')}
function csvCell(v){let s=String(v==null?'':v);if(/^[=+\-@\t\r]/.test(s))s="'"+s;return '"'+s.replaceAll('"','""')+'"'}
function exportCSV(){if(!d.expenses.length)return msg('لا توجد مصروفات لتصديرها');
  try{let rows=[['التاريخ','الاسم','الفئة','المبلغ','العملة'],...d.expenses.map(x=>[x.date,x.title,x.cat,x.amount,x.currency||cur()])];let csv='﻿'+rows.map(r=>r.map(csvCell).join(',')).join('\n');let blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='yomak-expenses.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}catch(err){msg('تعذر تصدير الملف. حاول مرة أخرى')}}

/* ---------- orders / profile ---------- */

function hasUndo(){try{return localStorage.getItem(UNDO_KEY)!==null}catch(e){return false}}

/* ---------- backup / restore ---------- */
function exportBackup(){
  try{
    const payload={app:'YOMAK',backupVersion:1,exportedAt:new Date().toISOString(),data:d};
    const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json;charset=utf-8'});
    const url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;a.download='yomak-backup-'+todayKey()+'.json';document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);msg('تم تجهيز النسخة الاحتياطية');
  }catch(err){msg('لم نتمكن من إنشاء النسخة. حاول مرة أخرى');}
}
function normalizeBackupData(raw){
  if(!isObj(raw))throw new Error('invalid');
  for(const key of ['expenses','orders','favs','added'])if(raw[key]!==undefined&&!Array.isArray(raw[key]))throw new Error('invalid-'+key);
  return sanitizeData(raw);
}
function afterRestore(){step=1;locBackup=null;if(d.name&&d.city)showApp();else showOn()}
function importBackup(file){
  if(!file)return;
  if(file.size>5*1024*1024){msg('حجم ملف النسخة أكبر من المسموح');return;}
  const reader=new FileReader();
  reader.onerror=()=>msg('تعذر قراءة الملف. تأكد أنه ملف نسخة يومك');
  reader.onload=()=>{
    let incoming;
    try{
      const parsed=JSON.parse(String(reader.result||'').replace(/^﻿/,''));
      if(!parsed||parsed.app!=='YOMAK'||parsed.backupVersion!==1||!parsed.data)throw new Error('format');
      incoming=normalizeBackupData(parsed.data);
    }catch(err){msg('الملف غير صالح أو ليس نسخة احتياطية من يومك');return;}
    if(!confirm('سيتم استبدال البيانات الحالية بالبيانات الموجودة في النسخة الاحتياطية. هل تريد المتابعة؟'))return;
    const previous=d;
    try{
      localStorage.setItem(UNDO_KEY,JSON.stringify(previous));
      d=incoming;
      if(!save()){d=previous;msg('لم نتمكن من حفظ الاسترجاع. بياناتك الحالية لم تتغير');return;}
      closeModal();afterRestore();msg('تم استرجاع النسخة الاحتياطية بنجاح');
    }catch(err){d=previous;try{save()}catch(e){}msg('تعذر استرجاع النسخة. بياناتك الحالية لم تتغير');}
  };
  try{reader.readAsText(file);}catch(err){msg('تعذر فتح الملف. حاول اختيار النسخة مرة أخرى');}
}
function undoRestore(){
  let raw=null;try{raw=localStorage.getItem(UNDO_KEY)}catch(e){}
  if(!raw)return msg('لا توجد نسخة سابقة للتراجع إليها');
  if(!confirm('سيتم استبدال البيانات الحالية بالبيانات التي كانت قبل آخر استرجاع. هل تريد المتابعة؟'))return;
  const previous=d;
  try{
    const inc=sanitizeData(JSON.parse(raw));
    localStorage.setItem(UNDO_KEY,JSON.stringify(previous));
    d=inc;
    if(!save()){d=previous;msg('لم نتمكن من حفظ التراجع. بياناتك الحالية لم تتغير');return;}
    afterRestore();msg('تم التراجع عن الاسترجاع');
  }catch(err){d=previous;msg('تعذر التراجع. بياناتك الحالية لم تتغير');}
}
function about(){openModal(`<button class="close" aria-label="إغلاق" onclick="closeModal()">×</button><h3>يومك YOMAK</h3><p>كل احتياجات يومك في مكان واحد.</p><p class="muted">نسخة أولية 0.1. بيانات الأنشطة أمثلة، ولا توجد طلبات أو دفع أو تتبع مباشر حقيقي في النسخة الحالية.</p><button class="primary" onclick="closeModal()">تمام</button>`)}

try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
save();init();
